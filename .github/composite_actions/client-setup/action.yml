name: "Client Setup"
description: "FEのCIの各Jobに必要なセットアップ処理をまとめたAction"

runs:
  using: "composite"
  steps:
    # pnpm のバージョンは package.json の packageManager から解決される
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
    # cache: "pnpm" を使うので pnpm のセットアップより後に実行する
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: "pnpm"
        cache-dependency-path: pnpm-lock.yaml
    # pnpm はストアからのハードリンクで復元が速いため、node_modules 自体は
    # キャッシュせずストア（上の cache: "pnpm"）のみキャッシュする
    - name: Install Dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
